[package]
name = "pine-core"
version.workspace = true
edition.workspace = true
description = "Sylva and Twitch clients for Sylva Control (no GUI code)."

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
thiserror.workspace = true
log.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "http2"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
