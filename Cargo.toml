[workspace]
resolver = "2"
members = ["crates/pine-core", "src-tauri"]

[workspace.package]
version = "0.2.1"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
thiserror = "1"
log = "0.4"
