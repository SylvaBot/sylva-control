name: Release

# Builds the Sylva Control installers with cargo-packager and publishes them as a GitHub Release
# named after the version in Cargo.toml. Run it by pushing a tag like v0.2.0, or by hand from
# the Actions tab (it then tags the commit it built). With the TAURI_SIGNING_PRIVATE_KEY secret
# set, it signs the update files and writes latest.json so installed copies update themselves.
# The key format is shared by cargo-packager's updater and Tauri's, so copies up to 0.7 (built
# with Tauri) update to this one too.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            formats: nsis
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            formats: app,dmg
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            formats: app,dmg
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            formats: deb,appimage
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libssl-dev libdbus-1-dev libasound2-dev pkg-config libfuse2 file
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cargo-packager
        shell: bash
        run: command -v cargo-packager || cargo install cargo-packager --locked
      - name: Build
        shell: bash
        run: |
          cargo build --release -p pine --target ${{ matrix.target }}
          # cargo-packager reads the app from target/release. The crate keeps the name pine so
          # copies run from a git checkout still build; installs get the name Tauri gave them.
          mkdir -p target/release
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=.exe
          name="Sylva Control"
          if [ "$RUNNER_OS" = Linux ]; then
            # cargo-packager's AppImage step cannot find a binary whose name has a space, and
            # Linux installs never had Tauri's name to keep, so use a plain one there.
            name=sylva-control
            sed -i 's/path = "Sylva Control"/path = "sylva-control"/' app/Cargo.toml
          fi
          cp "target/${{ matrix.target }}/release/pine$ext" "target/release/$name$ext"
      - name: Package
        shell: bash
        run: cargo packager -p pine --release --formats ${{ matrix.formats }}
      - name: Name, archive and sign the files
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir out
          case "${{ matrix.target }}" in
            x86_64-pc-windows-msvc)
              cp dist/*-setup.exe "out/Sylva-Control_${v}_x64-setup.exe"
              update="out/Sylva-Control_${v}_x64-setup.exe" ;;
            *-apple-darwin)
              arch=$([ "${{ matrix.target }}" = aarch64-apple-darwin ] && echo aarch64 || echo x64)
              cp dist/*.dmg "out/Sylva-Control_${v}_${arch}.dmg"
              tar -czf "out/Sylva-Control_${arch}.app.tar.gz" -C dist "Sylva Control.app"
              update="out/Sylva-Control_${arch}.app.tar.gz" ;;
            *-linux-gnu)
              cp dist/*.deb "out/Sylva-Control_${v}_amd64.deb"
              cp dist/*.AppImage "out/Sylva-Control_${v}_amd64.AppImage"
              update="out/Sylva-Control_${v}_amd64.AppImage" ;;
          esac
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx --yes @tauri-apps/cli@2 signer sign "$update"
          fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: sylva-control-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the version
        id: version
        run: echo "tag=v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Write latest.json for the in-app updater
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if ls out/*.sig >/dev/null 2>&1; then
          python3 - <<'PY'
          import glob, json, os, datetime
          tag, repo = os.environ["TAG"], os.environ["REPO"]
          base = f"https://github.com/{repo}/releases/download/{tag}/"
          files = {
              "windows-x86_64": ("*_x64-setup.exe", "nsis"),
              "macos-aarch64": ("Sylva-Control_aarch64.app.tar.gz", "app"),
              "macos-x86_64": ("Sylva-Control_x64.app.tar.gz", "app"),
              "linux-x86_64": ("*.AppImage", "appimage"),
          }
          platforms = {}
          for key, (pattern, fmt) in files.items():
              found = glob.glob(os.path.join("out", pattern))
              if len(found) != 1:
                  raise SystemExit(f"{key}: expected one {pattern}, found {found}")
              name = os.path.basename(found[0])
              sig = open(found[0] + ".sig").read().strip()
              platforms[key] = {"signature": sig, "url": base + name, "format": fmt}
          # Copies up to 0.7 were built with Tauri, whose updater names macOS "darwin".
          platforms["darwin-aarch64"] = platforms["macos-aarch64"]
          platforms["darwin-x86_64"] = platforms["macos-x86_64"]
          latest = {
              "version": tag.lstrip("v"),
              "notes": f"Sylva Control {tag.lstrip('v')}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          json.dump(latest, open("out/latest.json", "w"), indent=2)
          PY
          fi
          rm -f out/*.sig
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Sylva Control ${{ github.ref_type == 'tag' && github.ref_name || steps.version.outputs.tag }}
          body: |
            Windows: download `Sylva-Control_*_x64-setup.exe` and run it. It is not code signed yet, so if SmartScreen warns, click More info, then Run anyway.
            macOS: the `.dmg` (`aarch64` for Apple Silicon, `x64` for Intel). Not notarized yet: the first time, right click Sylva Control in Applications and choose Open.
            Linux: the `.AppImage` or `.deb`.
            Already have Sylva Control, Sylva Desktop or Cortex installed? It updates itself: click Update at the top when it appears.
          files: out/*
          fail_on_unmatched_files: true
